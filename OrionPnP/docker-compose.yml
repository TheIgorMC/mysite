services:
  orionpnp:
    build: .
    container_name: orionpnp_site
    restart: unless-stopped
    ports:
      - "1080:1080"
    environment:
      - PORT=1080
      # Optional: set this to protect the export endpoint.
      # - ORION_ADMIN_TOKEN=change-me
    volumes:
      - ./local_data:/app/local_data

  orionpnp-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: orionpnp_mcp
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - MCP_PORT=8765
      # Required for OAuth (e.g. claude.ai connectors): the public URL this server is reachable at.
      - ORION_MCP_ISSUER_URL=https://mcp.yourdomain.com
      # Optional: enables a simple static-token fallback (Authorization: Bearer <token>) for
      # non-OAuth clients like the Claude Code CLI. Leave unset to require OAuth only.
      # - ORION_MCP_TOKEN=change-me
    volumes:
      - ./local_data:/app/local_data
